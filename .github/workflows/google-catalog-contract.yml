name: Live Google firmware catalog contract
on:
  push:
    branches: [main]
    paths: ['tools/FlowAndroid.CatalogSmoke/**', 'src/FlowAndroid.Core/Firmware/GoogleFirmwareCatalog.cs', '.github/workflows/google-catalog-contract.yml']
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify live Google OTA/Factory catalogs
        run: dotnet run --project tools/FlowAndroid.CatalogSmoke/FlowAndroid.CatalogSmoke.csproj -c Release
