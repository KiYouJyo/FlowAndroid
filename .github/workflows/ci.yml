name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowandroid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/FlowAndroid.Core.Tests/FlowAndroid.Core.Tests.csproj --configuration Release

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore application
        run: dotnet restore src/FlowAndroid.App/FlowAndroid.App.csproj -p:Platform=x64
      - name: Build WinUI 3 shell
        run: dotnet build src/FlowAndroid.App/FlowAndroid.App.csproj -c Release -p:Platform=x64 --no-restore
      - name: Upload diagnostic preview (not an installer)
        uses: actions/upload-artifact@v4
        with:
          name: FlowAndroid-win-x64-diagnostic-preview
          path: src/FlowAndroid.App/bin/x64/Release/**/*
          if-no-files-found: error
