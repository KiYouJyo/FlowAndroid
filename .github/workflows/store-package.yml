name: Microsoft Store submission package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  store-package:
    runs-on: windows-latest
    env:
      STORE_PACKAGE_ID: ${{ vars.FLOWANDROID_STORE_PACKAGE_ID }}
      STORE_PUBLISHER: ${{ vars.FLOWANDROID_STORE_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Validate Partner Center identity
        shell: pwsh
        run: |
          if (!$env:STORE_PACKAGE_ID -or !$env:STORE_PUBLISHER) { throw 'Configure FLOWANDROID_STORE_PACKAGE_ID and FLOWANDROID_STORE_PUBLISHER from Partner Center before building Store packages.' }
          ./scripts/Prepare-MsixIdentity.ps1 -PackageIdentity $env:STORE_PACKAGE_ID -PublisherSubject $env:STORE_PUBLISHER
          ./scripts/Check-MsixPackage.ps1
      - name: Stamp monotonic Store MSIX version
        shell: pwsh
        run: ./scripts/Set-MsixVersion.ps1 -BuildNumber ${{ github.run_number }}
      - name: Build unsigned Store package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/FlowAndroid.Core.Tests/FlowAndroid.Core.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }
          $args = @('src/FlowAndroid.App/FlowAndroid.App.csproj','/restore','/t:Build','/p:Configuration=Release','/p:Platform=x64','/p:FlowAndroidStoreBuild=true','/p:WindowsPackageType=MSIX','/p:EnableMsixTooling=true','/p:GenerateAppxPackageOnBuild=true','/p:AppxPackageSigningEnabled=false','/p:UapAppxPackageBuildMode=StoreUpload','/p:AppxBundle=Never',"/p:AppxPackageDir=$env:GITHUB_WORKSPACE\AppPackages\")
          & msbuild @args
          if ($LASTEXITCODE -ne 0) { throw 'Store MSIX compilation failed.' }
          $apps = @(Get-ChildItem AppPackages -Recurse -File -Filter 'FlowAndroid.App*.msix' | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })
          $uploads = @(Get-ChildItem AppPackages -Recurse -File -Filter '*.msixupload')
          New-Item -ItemType Directory store -Force | Out-Null
          if ($uploads.Count -eq 1) {
            Copy-Item $uploads[0].FullName 'store/FlowAndroid-Store.msixupload'
          } elseif ($apps.Count -eq 1) {
            Compress-Archive -Path $apps[0].FullName -DestinationPath 'store/FlowAndroid-Store.zip'
            Rename-Item 'store/FlowAndroid-Store.zip' 'FlowAndroid-Store.msixupload'
          } else {
            throw 'Expected a Store upload package or single signed-by-Store-ready MSIX.'
          }
          $sha = (Get-FileHash 'store/FlowAndroid-Store.msixupload' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  FlowAndroid-Store.msixupload" | Set-Content 'store/SHA256SUMS.txt' -Encoding utf8
          'UNSIGNED Store submission candidate. Microsoft Store will sign after Partner Center certification; upload and submit manually only after real Pixel safety acceptance.' | Set-Content 'store/README.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: FlowAndroid-Store-submission-candidate
          path: store/*
          if-no-files-found: error
